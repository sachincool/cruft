name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    # goreleaser-action@v6 still ships a Node 20 entrypoint; opt into the
    # Node 24 runtime now so the run is clean ahead of GitHub forcing it.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin to the v2 line rather than `latest`, so a future
          # goreleaser v3 can't change the build out from under a tag.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on sachincool/homebrew-tap so
          # goreleaser can push the updated Formula/cruft.rb on release.
          # Set this secret in repo settings → Secrets → Actions.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
