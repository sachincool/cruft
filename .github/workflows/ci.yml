name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w ./cmd ./internal && git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/cruft
