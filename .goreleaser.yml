version: 2

project_name: cruft

before:
  hooks:
    - go mod tidy

builds:
  - id: cruft
    main: ./cmd/cruft
    binary: cruft
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.versionString={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew distribution is a cask (not a formula): GoReleaser deprecated
# `brews` in favour of `homebrew_casks`, and casks are the right shape for
# a pre-built binary. macOS-only by definition, which matches the project.
# `brew install sachincool/tap/cruft` and `brew upgrade cruft` both work
# against the tap below.
homebrew_casks:
  - name: cruft
    homepage: https://github.com/sachincool/cruft
    description: "Decruft your dev laptop. 25 cleaners, deletes on confirm, --safe for 7-day undo."
    repository:
      owner: sachincool
      name: homebrew-tap
      branch: main
      # Personal access token with `contents: write` on the tap repo.
      # Set as a repo secret HOMEBREW_TAP_GITHUB_TOKEN on sachincool/cruft;
      # the release workflow exposes it to GoReleaser.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary is unsigned (no paid Apple Developer cert). Without this,
    # Gatekeeper quarantines the download and macOS refuses to run it with
    # "cruft is damaged and can't be opened". Strip the quarantine bit on
    # install. Drop this hook if/when the binary gets signed + notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cruft"]
          end
    caveats: |
      cruft is macOS-only for now.
        cruft                 # interactive TUI
        cruft run --all       # non-interactive
        cruft glossary        # define every term cruft uses
      Audit logs: ~/.local/share/cruft/runs/
      Recycle (--safe only):   ~/.local/share/cruft/tombstone/
